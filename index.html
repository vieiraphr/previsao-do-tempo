<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Previsão do Tempo</title>
  <script src="js/script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Previsão do Tempo</h1>

    <!-- Busca -->
    <form id="form-busca" class="busca" role="search">
      <label for="campo-cidade" class="visually-hidden">Nome da cidade</label>
      <input
        type="text"
        id="campo-cidade"
        name="cidade"
        placeholder="Digite o nome de uma cidade"
        autocomplete="off"
        required
      >
      <button type="submit">Buscar</button>
    </form>

    <!-- Mensagem de status (carregando / erro) -->
    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <!-- Resultado -->
    <section id="resultado" class="resultado" aria-labelledby="local" hidden>
      <header class="local">
        <h2 id="local">
          <span id="cidade">--</span>
        </h2>
        <p>
          <span id="estado">--</span>, <span id="pais">--</span>
        </p>
      </header>

      <div class="atual">
        <p class="temperatura">
          <span id="temperatura">--</span><span class="unidade">°C</span>
        </p>
        <p id="descricao" class="descricao">--</p>
      </div>

      <dl class="detalhes">
        <div>
          <dt>Sensação</dt>
          <dd><span id="sensacao">--</span>°C</dd>
        </div>
        <div>
          <dt>Umidade</dt>
          <dd><span id="umidade">--</span>%</dd>
        </div>
        <div>
          <dt>Vento</dt>
          <dd><span id="vento">--</span> km/h</dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
